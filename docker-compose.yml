# FutureVest - Local development stack
# Usage: docker compose up -d
# Backend: http://localhost:8080/api | Frontend: http://localhost:3000 (dev) or use frontend service
# MySQL: localhost:3306 | Redis: localhost:6379

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: futurevest
      MYSQL_USER: futurevest
      MYSQL_PASSWORD: futurevest
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: futurevest
      MYSQL_USER: futurevest
      MYSQL_PASSWORD: futurevest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-min-32-chars-for-jwt-signing-key
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
