apiVersion: apps/v1
kind: Deployment
metadata:
  name: futurevest-backend
  namespace: futurevest
  labels:
    app: futurevest
    component: backend
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: futurevest
      component: backend
  template:
    metadata:
      labels:
        app: futurevest
        component: backend
        environment: production
    spec:
      containers:
      - name: backend
        image: futurevest/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: database-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: database-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: database-password
        - name: SPRING_REDIS_HOST
          value: "futurevest-redis"
        - name: SPRING_REDIS_PORT
          value: "6379"
        - name: SPRING_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: redis-password
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: aws-access-key
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: aws-secret-key
        - name: AWS_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: s3-bucket
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: aws-region
        - name: RAZORPAY_KEY_ID
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: razorpay-key-id
        - name: RAZORPAY_SECRET
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: razorpay-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: futurevest-secrets
              key: jwt-secret
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: futurevest-config
              key: cors-allowed-origins
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
            add:
              - NET_BIND_SERVICE
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: backend-logs-pvc
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: futurevest-backend-service
  namespace: futurevest
  labels:
    app: futurevest
    component: backend
    environment: production
spec:
  selector:
    matchLabels:
      app: futurevest
      component: backend
  ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP
  type: ClusterIP
  sessionAffinity:
    clientIP:
      timeoutSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: futurevest-backend-headless
  namespace: futurevest
  labels:
    app: futurevest
    component: backend
    environment: production
spec:
  selector:
    matchLabels:
      app: futurevest
      component: backend
  ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: HorizontalPodAutoscaler
metadata:
  name: futurevest-backend-hpa
  namespace: futurevest
  labels:
    app: futurevest
    component: backend
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: futurevest-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-logs-pvc
  namespace: futurevest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: futurevest-backend-pdb
  namespace: futurevest
  labels:
    app: futurevest
    component: backend
    environment: production
spec:
  minAvailable: 2
  maxUnavailable: 1
  selector:
    matchLabels:
      app: futurevest
      component: backend
