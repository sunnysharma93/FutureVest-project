spring:
  application:
    name: futurevest-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# Server - HTTPS handled by reverse proxy in production
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Actuator - health and metrics (sensitive endpoints secured)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true

# Logging - SLF4J
logging:
  level:
    root: INFO
    com.futurevest: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Application config - use env vars or profile-specific overrides
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: futurevest
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:futurevest-bucket}
      region: ${AWS_REGION:ap-south-1}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 500ms
  ratelimiter:
    instances:
      auth:
        limitForPeriod: ${RATE_LIMIT_AUTH_PER_PERIOD:20}
        limitRefreshPeriod: 60s
        timeoutDuration: 0
