spring:
  application:
    name: futurevest-backend

  datasource:
    # 127.0.0.1 use karna localhost se zyada stable hota hai
    url: jdbc:mysql://127.0.0.1:3306/futurevestDb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # Single quotes use karein agar password mein @ jaise special chars hain
    password: '@Coding1@'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: FutureVestHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.futurevest: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"