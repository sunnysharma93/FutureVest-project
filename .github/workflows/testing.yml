name: Testing Suite

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  # Backend Testing
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: futurevest_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --default-authentication-plugin=mysql_native_password
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: '3.9.4'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Maven tests
      run: |
        cd backend
        mvn clean test \
          -Dspring.profiles.active=test \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/futurevest_test \
          -Dspring.datasource.username=test_user \
          -Dspring.datasource.password=test_password \
          -Dspring.redis.host=localhost \
          -Dspring.redis.port=6379

    - name: Run Maven integration tests
      run: |
        cd backend
        mvn verify -P integration-tests \
          -Dspring.profiles.active=integration-test \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/futurevest_test \
          -Dspring.datasource.username=test_user \
          -Dspring.datasource.password=test_password

    - name: Generate JaCoCo test report
      run: |
        cd backend
        mvn jacoco:report

    - name: Upload JaCoCo coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage

    - name: Run SonarQube scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        cd backend
        mvn sonar:sonar \
          -Dsonar.projectKey=FutureVest_backend \
          -Dsonar.organization=futurevest \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          backend/target/surefire-reports/
          backend/target/failsafe-reports/
          backend/target/site/jacoco/

  # Frontend Testing
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run ESLint
      run: |
        cd frontend
        npm run lint

    - name: Run Prettier check
      run: |
        cd frontend
        npm run format:check

    - name: Run TypeScript type checking
      run: |
        cd frontend
        npm run type-check

    - name: Run unit tests
      run: |
        cd frontend
        npm run test:unit -- --coverage --watchAll=false

    - name: Run integration tests
      run: |
        cd frontend
        npm run test:integration -- --coverage --watchAll=false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-test-results
        path: |
          frontend/coverage/
          frontend/test-results/

  # E2E Testing
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: futurevest_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --default-authentication-plugin=mysql_native_password
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: '3.9.4'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build backend
      run: |
        cd backend
        mvn clean package -DskipTests \
          -Dspring.profiles.active=test \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/futurevest_test \
          -Dspring.datasource.username=test_user \
          -Dspring.datasource.password=test_password

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Start backend
      run: |
        cd backend
        java -jar target/futurevest-*.jar \
          --spring.profiles.active=test \
          --server.port=8080 &
        sleep 30

    - name: Start frontend
      run: |
        cd frontend
        npm run preview &
        sleep 10

    - name: Install Cypress
      run: |
        cd frontend
        npm run cypress:install

    - name: Run Cypress E2E tests
      uses: cypress-io/github-action@v6
      with:
        working-directory: frontend
        wait-on: 'http://localhost:3000'
        wait-on-timeout: 120
        browser: chrome
        record: true
        parallel: true
        group: 'E2E Tests'
      env:
        CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CYPRESS_baseUrl: http://localhost:3000

    - name: Upload Cypress screenshots
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: cypress-screenshots
        path: frontend/cypress/screenshots

    - name: Upload Cypress videos
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: cypress-videos
        path: frontend/cypress/videos

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: futurevest_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --default-authentication-plugin=mysql_native_password
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Artillery
      run: npm install -g artillery

    - name: Build and start backend
      run: |
        cd backend
        mvn clean package -DskipTests \
          -Dspring.profiles.active=test \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/futurevest_test \
          -Dspring.datasource.username=test_user \
          -Dspring.datasource.password=test_password
        java -jar target/futurevest-*.jar \
          --spring.profiles.active=test \
          --server.port=8080 &
        sleep 30

    - name: Run Artillery performance tests
      run: |
        artillery run tests/performance/load-test.yml

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: artillery-report.html

  # Security Testing
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner (Backend)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './backend'
        format: 'sarif'
        output: 'trivy-backend-results.sarif'

    - name: Run Trivy vulnerability scanner (Frontend)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './frontend'
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-backend-results.sarif'

    - name: Run npm audit (Frontend)
      run: |
        cd frontend
        npm audit --audit-level=moderate

    - name: Run OWASP Dependency Check (Backend)
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'backend'
        path: './backend'
        format: 'HTML'

    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-results
        path: |
          trivy-backend-results.sarif
          trivy-frontend-results.sarif
          reports/

  # Quality Gates
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, performance-tests, security-tests]

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Check test coverage thresholds
      run: |
        # Backend coverage check (minimum 80%)
        BACKEND_COVERAGE=$(cat backend-test-results/coverage.txt | grep -o '[0-9]*%' | head -1 | tr -d '%')
        if [ "$BACKEND_COVERAGE" -lt 80 ]; then
          echo "Backend coverage $BACKEND_COVERAGE% is below threshold 80%"
          exit 1
        fi

        # Frontend coverage check (minimum 80%)
        FRONTEND_COVERAGE=$(cat frontend-test-results/coverage/coverage-summary.json | jq -r '.total.lines.pct')
        if (( $(echo "$FRONTEND_COVERAGE < 80" | bc -l) )); then
          echo "Frontend coverage $FRONTEND_COVERAGE% is below threshold 80%"
          exit 1
        fi

    - name: Check performance benchmarks
      run: |
        # Check if performance tests passed
        if [ ! -f "performance-results/artillery-report.html" ]; then
          echo "Performance tests failed or did not generate report"
          exit 1
        fi

    - name: Check security scan results
      run: |
        # Check for critical vulnerabilities
        if grep -q "CRITICAL" security-results/trivy-backend-results.sarif; then
          echo "Critical vulnerabilities found in backend"
          exit 1
        fi
        if grep -q "CRITICAL" security-results/trivy-frontend-results.sarif; then
          echo "Critical vulnerabilities found in frontend"
          exit 1
        fi

    - name: Generate test summary
      run: |
        echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Backend Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Frontend Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ E2E Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Performance Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Security Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Quality Gates: Passed" >> $GITHUB_STEP_SUMMARY

  # Notification
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always()

    steps:
    - name: Notify Slack on success
      if: needs.quality-gates.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#ci-cd'
        text: '✅ All tests passed successfully!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on failure
      if: needs.quality-gates.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ci-cd'
        text: '❌ Tests failed! Please check the logs.'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
